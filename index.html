<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayerSync — We build the systems businesses run on</title>

    <!-- ===== Brand: favicon & icon package ===== -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#050505">

    <!-- ===== SEO & social sharing ===== -->
    <meta name="description" content="LayerSync builds the custom systems businesses run on — including SynCRM, the operating system for real estate agencies. We diagnose, build, and hand over. Based in Harare, Zimbabwe.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="LayerSync — We build the systems businesses run on">
    <meta property="og:description" content="Custom operations systems, AI agents, and SynCRM for real estate. We diagnose, build, and hand over.">
    <meta property="og:image" content="/og-image-v2.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LayerSync — We build the systems businesses run on">
    <meta name="twitter:description" content="Custom operations systems, AI agents, and SynCRM for real estate. We diagnose, build, and hand over.">
    <meta name="twitter:image" content="/og-image-v2.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* ===== Brand palette remap (CDN Tailwind) =====
           Keeps every existing utility class name in place but resolves the
           legacy purple/blue/cyan hues to the new LayerSync brand:
             warm/primary  -> orange  #D36135
             cool/secondary -> green   #7FB069
           This recolours the whole site to the new identity without touching
           any markup or the layout. */
        const brandOrange = {
            50: '#FCF1EC', 100: '#F8DDD1', 200: '#F0B89F', 300: '#E5926E',
            400: '#DC7A4F', 500: '#D36135', 600: '#BC4F28', 700: '#973D20',
            800: '#79331C', 900: '#632C1B', 950: '#35140A',
        };
        const brandGreen = {
            50: '#F2F7EE', 100: '#E2EED8', 200: '#C7DDB4', 300: '#A6C98A',
            400: '#92BD74', 500: '#7FB069', 600: '#649551', 700: '#4E7641',
            800: '#405E37', 900: '#374E30', 950: '#1B2916',
        };
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Warm end of the old gradients -> brand orange
                        blue: brandOrange, indigo: brandOrange, violet: brandOrange,
                        purple: brandOrange, fuchsia: brandOrange, pink: brandOrange,
                        // Cool end of the old gradients -> brand green
                        sky: brandGreen, cyan: brandGreen, teal: brandGreen,
                        emerald: brandGreen, green: brandGreen,
                        // Explicit brand tokens for new work
                        brand: { orange: '#D36135', green: '#7FB069', DEFAULT: '#D36135' },
                        // Semantic dark-mode typography + wordmark tokens.
                        // These are declared in tailwind.config.ts but the live
                        // site uses the Tailwind CDN, which does NOT read that
                        // file — so they must be defined here too, otherwise
                        // classes like `dark:text-dark-text-primary` silently
                        // do nothing and leave dark text on the dark theme.
                        'dark-text': { primary: '#F8FAFC', secondary: '#CBD5E1', tertiary: '#94A3B8' },
                        'dark-brand': { wordmark: '#A6C98A' },
                    },
                },
            },
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-light: #f5f5f7;
            --brand-orange: #D36135;
            --brand-green: #7FB069;
            /* Back-compat aliases mapped onto the new brand palette */
            --brand-blue: #D36135;
            --brand-purple: #D36135;
            --brand-cyan: #7FB069;
        }

        * {
            cursor: default;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-color: #050505;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }


        .text-shimmer {
            background: linear-gradient(to right,
                    rgba(0, 0, 0, 0.3) 0%,
                    rgba(0, 0, 0, 0.9) 50%,
                    rgba(0, 0, 0, 0.3) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 12s infinite linear;
            /* prevent descender clipping on clipped-text headings */
            padding-bottom: 0.08em;
        }

        .dark .text-shimmer {
            background: linear-gradient(to right,
                    rgba(255, 255, 255, 0.4) 0%,
                    rgba(255, 255, 255, 1) 50%,
                    rgba(255, 255, 255, 0.4) 100%);
            -webkit-background-clip: text;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dark .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hero-heading {
            font-size: clamp(2.25rem, 6vw, 6rem);
            line-height: 1.16;
            letter-spacing: -0.04em;
            font-weight: 300;
            /* Give descenders (g, y, p) room — iOS clips them with
               background-clip:text at tight line-heights. */
            padding-bottom: 0.12em;
        }

        .sub-heading {
            font-size: clamp(1rem, 2vw, 1.25rem);
            letter-spacing: -0.01em;
            font-weight: 300;
            opacity: 0.7;
            line-height: 1.6;
        }

        .nav-scrolled {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(20px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 1rem !important;
            padding-bottom: 1rem !important;
        }

        .dark .nav-scrolled {
            background: rgba(5, 5, 5, 0.8) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(211, 97, 53, 0.35);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== Global Button Hover ===== */
        button,
        a[class*="btn"],
        a[class*="rounded-full"] {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button:hover,
        a[class*="btn"]:hover,
        a[class*="rounded-full"]:hover {
            transform: translateY(-1px);
        }

        button:active,
        a[class*="btn"]:active,
        a[class*="rounded-full"]:active {
            transform: translateY(0px) scale(0.98);
        }

        /* ===== Button Shimmer / Glow ===== */
        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.15) 40%,
                    rgba(255, 255, 255, 0.3) 50%,
                    rgba(255, 255, 255, 0.15) 60%,
                    transparent 100%);
            animation: btn-shimmer 3s ease-in-out infinite;
            pointer-events: none;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 20px rgba(211, 97, 53, 0.3),
                0 0 60px rgba(127, 176, 105, 0.18),
                0 10px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes btn-shimmer {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        /* ===== Gradient Animation ===== */
        @keyframes gradient-x {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animate-gradient-x {
            background-size: 200% 200%;
            animation: gradient-x 4s ease infinite;
        }

        /* ===== Ambient Glow ===== */
        .ambient-glow {
            animation: pulse-glow 6s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.7;
            }
        }

        /* ===== Card Hover Glow ===== */
        .card-hover-glow {
            position: relative;
            overflow: hidden;
        }

        .card-hover-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(211, 97, 53, 0.06) 0%, transparent 50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card-hover-glow:hover::after {
            opacity: 1;
        }

        /* ===== Float Animation ===== */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* ===== Slow drift (parametric floating orbs) ===== */
        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(4%, -6%) scale(1.06); }
            66%  { transform: translate(-5%, 4%) scale(0.96); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-drift { animation: drift 18s ease-in-out infinite; }

        /* ===== Aurora mesh (animated hero backdrop) ===== */
        @keyframes aurora {
            0%, 100% { background-position: 0% 50%, 100% 50%; }
            50%      { background-position: 100% 50%, 0% 50%; }
        }
        .aurora-bg {
            background-size: 200% 200%, 200% 200%;
            animation: aurora 18s ease-in-out infinite;
        }

        /* ===== Moving blueprint grid ===== */
        @keyframes grid-pan {
            from { background-position: 0 0; }
            to   { background-position: 48px 48px; }
        }
        .bg-grid {
            background-image:
                linear-gradient(to right, currentColor 1px, transparent 1px),
                linear-gradient(to bottom, currentColor 1px, transparent 1px);
            background-size: 48px 48px;
            animation: grid-pan 6s linear infinite;
        }

        /* ===== Conic spin (slow halo behind product visuals) ===== */
        @keyframes spin-slow { to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 28s linear infinite; }

        /* ===== Marquee row (kanban / showcase ticker) ===== */
        @keyframes marquee-up {
            from { transform: translateY(0); }
            to   { transform: translateY(-50%); }
        }
        .animate-marquee-up { animation: marquee-up 16s linear infinite; }

        /* ===== Arrow nudge on CTA hover ===== */
        .cta-arrow { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .group:hover .cta-arrow,
        .btn-glow:hover .cta-arrow { transform: translateX(4px); }

        @media (prefers-reduced-motion: reduce) {
            .animate-drift, .aurora-bg, .bg-grid, .animate-spin-slow,
            .animate-marquee-up, .animate-float, .ambient-glow, .text-shimmer {
                animation: none !important;
            }
        }
    </style>
</head>

<body class="bg-[#050505]">
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
